# Ізольований стенд для e2e-тестів (Playwright): своя БД у пам'яті, власні
# порти, без volume з кодом — не чіпає dev-базу з docker-compose.yml.
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   cd frontend && npm run e2e
#   docker compose -f docker-compose.e2e.yml down
name: hrm-e2e

services:
  db:
    image: postgres:17.0-alpine
    environment:
      - POSTGRES_DB=hrm
      - POSTGRES_USER=hrm
      - POSTGRES_PASSWORD=hrm
    # Дані лише в пам'яті: кожен запуск — з чистої бази
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - SECRET_KEY=e2e-only-not-a-secret
      - ALLOWED_HOSTS=api,localhost,127.0.0.1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=hrm
      - POSTGRES_USER=hrm
      - POSTGRES_PASSWORD=hrm
      # Без Redis (кеш у пам'яті) і без OpenAI (асистент відповідає 503)
      - REDIS_URL=
      - OPENAI_API_KEY=
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo --password Demo-pass-2026 &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"
      interval: 3s
      timeout: 10s
      retries: 40

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://api:8000
      - COOKIE_SECURE=false
    ports:
      - "${E2E_PORT:-13000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
