# Every push to main: CI, then GitHub Actions SSHes into the server as the deploy user,
# whose login shell is the dispatcher: it takes the repository name and runs
# /www/hrm/deploy.sh (docs/deploy.md). A failed CI skips the deploy.
# The shared template of the server (agreed with its administrator): change only
# the pinned action's version (Dependabot).
name: deploy via ssh

on:
  push:
    branches:
      - main

permissions: {}

# Temporary, until the server is ready (docs/deploy.md): "0" runs CI but skips the deploy
# step; "1" deploys. Remove this and the step's `if:` once production is live.
env:
  START: "0"

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    name: Deploy to the Production
    runs-on: ubuntu-latest
    # Sends the repository name over SSH and reads nothing from the repository.
    permissions: {}

    steps:
      - name: deploy on push
        if: ${{ env.START == '1' }}
        # v1.2.5, pinned by commit: a moved tag or branch cannot change the code that gets
        # the deploy key. Dependabot proposes updates.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOYHOST }}
          username: ${{ secrets.DEPLOYLOGIN }}
          key: ${{ secrets.DEPLOYKEY }}
          port: 22
          script: ${{ github.event.repository.name }}
