[project]
name = "hrm-new"
version = "0.1.0"
description = "HRM System — MVP"
requires-python = ">=3.14"

dependencies = [
    # Django core
    "django>=5.2,<6.0",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.28.0",
    "django-filter>=25.1",
    "django-mptt>=0.17.0",
    "django-simple-history>=3.8.0",
    "django-storages[s3]>=1.14.6",
    # Database
    "psycopg2-binary>=2.9.10",
    # OpenAI
    "openai>=1.77.0,<2.0",
    "tiktoken>=0.9.0",
    # AWS
    "boto3>=1.37.35",
    "gunicorn>=23.0.0",
    "graphviz>=0.20.3",
    "django-environ>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
# Django-проєкт, а не бібліотека — не збираємо і не встановлюємо як пакет
package = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".venv",
    "__pycache__",
    "migrations",
    "manage.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]
known-third-party = [
    "django",
    "rest_framework",
    "openai",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false


