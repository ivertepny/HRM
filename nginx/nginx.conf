# nginx стеку (docker-compose.server.yml). Перед ним — nginx хоста з TLS.
# Усе йде в Next.js: Django (API, адмінка, swagger) з інтернету недоступний.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # HSTS лише для запитів, які nginx хоста прийняв по HTTPS. Те саме
    # значення, що SECURE_HSTS_SECONDS у .env: почати з 3600, потім 31536000.
    map $http_x_forwarded_proto $hsts {
        https   "max-age=3600; includeSubDomains";
        default "";
    }

    # Ліміт запитів на IP клієнта (справжній — див. real_ip нижче)
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    # Вхід — окремо і суворіше (підбір пароля); burst — на офіс за одним NAT
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name _;

        # Справжня адреса клієнта — від nginx хоста (через Docker bridge)
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        client_max_body_size 1m;

        add_header Strict-Transport-Security $hsts always;
        # Django теж ставить HSTS — у браузер іде лише заголовок nginx
        proxy_hide_header Strict-Transport-Security;

        proxy_http_version 1.1;
        # З портом, як у браузері: BFF звіряє його з Origin (захист від CSRF)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS завершився на nginx хоста: передаємо його схему, не нашу (http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Хешовані незмінні ресурси збірки — без ліміту
        location /_next/static/ {
            proxy_pass http://frontend:3000;
        }

        location = /api/auth/login {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://frontend:3000;
        }

        # Через BFF ідуть і завантаження файлів (MAX_UPLOAD_SIZE_MB = 10;
        # 11m — запас на multipart)
        location /api/backend/ {
            client_max_body_size 11m;
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://frontend:3000;
        }

        # AI-асистент: кілька викликів моделі поспіль довші за типові 60 с
        location /api/backend/api/ai/ {
            limit_req zone=per_ip burst=10 nodelay;
            proxy_read_timeout 120s;
            proxy_pass http://frontend:3000;
        }

        location / {
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://frontend:3000;
        }
    }
}
