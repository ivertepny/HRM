services:
  api:
    build: .
    container_name: api
    restart: always
    # Образ за замовчуванням запускає gunicorn (prod); у dev — runserver з автоперезапуском
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_roles &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/usr/src/
    ports:
      # API_PORT — якщо 8000 на хості вже зайнятий іншим проєктом
      - "${API_PORT:-8000}:8000"
#    networks:
#      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
#      - EMAIL_HOST=${EMAIL_HOST}
#      - EMAIL_PORT=${EMAIL_PORT}
#      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
#      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
#      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
#      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
#      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    environment:
      # BFF ходить у Django всередині мережі compose
      - BACKEND_URL=http://api:8000
      # Стенд по HTTP: Secure-cookie працюють лише на localhost
      - COOKIE_SECURE=false

  db:
    image: postgres:17.0-alpine
    container_name: db
    restart: on-failure
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
#    networks:
#      - app-network
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: on-failure
    # Без пароля — тому порт доступний лише з цієї машини
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
#    networks:
#      - app-network
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin/data
    depends_on:
      - db


volumes:
  postgres-data:
  pgadmin-data:
